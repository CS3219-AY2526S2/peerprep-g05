include:
  - ./services/collaboration/compose.yml

services:
  # ── Question Service ────────────────────────────────────────
  question-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: questions_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - question_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - peerprep-network

  question-service:
    build:
      context: ./services/question
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: production
      POSTGRES_HOST: question-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: questions_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    depends_on:
      question-db:
        condition: service_healthy
    networks:
      - peerprep-network

  # ── Seed job (run once) ─────────────────────────────────────
  question-seed:
    build:
      context: ./services/question
      dockerfile: Dockerfile
    command: ["node", "scripts/seed.js"]
    environment:
      POSTGRES_HOST: question-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: questions_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    depends_on:
      question-db:
        condition: service_healthy
    restart: "no"
    profiles:
      - seed
    networks:
      - peerprep-network

  # ── User Service ─────────────────────────────────────────────
  user-db:
    image: postgres:16-alpine
    container_name: peerprep-user-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: peerprep_users
    ports:
      - "5434:5432"
    volumes:
      - user_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d peerprep_users"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - peerprep-network

  user-migrate:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run migrate"
    volumes:
      - ./services/user:/app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@user-db:5432/peerprep_users
    depends_on:
      user-db:
        condition: service_healthy
    restart: "no"
    profiles:
      - migrate
    networks:
      - peerprep-network

  user-service:
    build:
      context: ./services/user
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./services/user/.env
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@user-db:5432/peerprep_users
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - peerprep-network



  # ---------------- INFRASTRUCTURE ----------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - peerprep-network

  # ---------------- GATEWAY ----------------
  gateway:
    build: ./backend
    container_name: gateway
    command: node server.js
    depends_on:
      - rabbitmq
    environment:
      MATCHING_SERVICE_URL: http://matchmaking-server:3000
      QUESTION_SERVICE_URL: http://question-service:3002
      USER_SERVICE_URL: http://user-service:3001
      RABBITMQ_URL: amqp://rabbitmq:5672
      MATCH_EVENTS_EXCHANGE: match.events
    ports:
      - "4000:4000"
    networks:
      - peerprep-network

  # ---------------- WEBSOCKET SERVICE ----------------
  ws-service:
    build: ./backend/ws-Service
    container_name: ws-service
    command: node server.js
    depends_on:
      - rabbitmq
    environment:
      MATCH_EXCHANGE: matchmaking.exchange
      RABBITMQ_URL: amqp://rabbitmq:5672
      MATCH_EVENTS_EXCHANGE: match.events
    ports:
      - "4001:4001"
    networks:
      - peerprep-network


volumes:
  question_pgdata:
  user_pgdata:

networks:
  peerprep-network:
    external: true