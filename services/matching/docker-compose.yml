services:

  postgres:
    image: postgres:16
    container_name: matchmaking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: matchdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d matchdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis
    container_name: matchmaking-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: matchmaking-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    container_name: matchmaking-server
    command: node server.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgresql://admin:admin@postgres:5432/matchdb
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
      MATCH_EXCHANGE: matchmaking.exchange
    ports:
      - "3000:3000"

  matching-worker:
    build: .
    container_name: matching-worker
    command: node workers/match_worker/worker.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgresql://admin:admin@postgres:5432/matchdb
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
      MATCH_EXCHANGE: matchmaking.exchange

  timeout-worker:
    build: .
    container_name: timeout-worker
    command: node workers/timeout_worker/worker.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgresql://admin:admin@postgres:5432/matchdb
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
      MATCH_EXCHANGE: matchmaking.exchange

volumes:
  postgres_data: