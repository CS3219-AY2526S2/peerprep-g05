name: collaboration-service
services:
  server:
    build:
      context: .
      args:
        EXPRESS_PORT: ${EXPRESS_PORT}
        QUESTION_API_BASE_URL: ${QUESTION_API_BASE_URL}
    ports:
      - ${EXPRESS_PORT}:${EXPRESS_PORT}
    depends_on:
      - redis
    environment:
      QUESTON_API_BASE_URL: ${QUESTION_API_BASE_URL}
      REDIS_URL: "redis://redis:6379"
      EXPRESS_PORT: ${EXPRESS_PORT}

  redis:
    image: redis:8.2.1-alpine
    ports:
      - 6379:6379
