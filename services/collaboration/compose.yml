name: collaboration-service

services:
  collaboration-server:
    build:
      context: .
      args:
        EXPRESS_PORT: 3003
    ports:
      - 3003:3003
    depends_on:
      - collaboration-redis
    environment:
      QUESTION_API_BASE_URL: http://question-service:3002 #share same network so can driectly call the service name
      REDIS_URL: "redis://collaboration-redis:6379"
      GATEWAY_URL: http://gateway:4000
      EXPRESS_PORT: 3003
      NODE_ENV: production
    networks:
      - peerprep-network
    restart: always

  collaboration-redis:
    image: redis:8.2.1-alpine
    ports:
      - 6380:6379
    restart: always
    networks:
      - peerprep-network
